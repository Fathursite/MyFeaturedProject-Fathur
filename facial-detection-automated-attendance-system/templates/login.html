<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Owner | Coffee ID</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --stroke: #1a1c1e;
            --bg-main: #f4f1ea;
            --neo-blue: #3b82f6;
            --neo-yellow: #facc15;
            --shadow-large: 8px 8px 0px #1a1c1e;
        }

        body { 
            background-color: var(--bg-main); 
            font-family: 'Lexend', sans-serif; 
            color: var(--stroke);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border: 4px solid var(--stroke) !important;
            border-radius: 0px !important;
            box-shadow: var(--shadow-large);
            width: 100%;
            max-width: 420px;
        }

        .form-control {
            border: 3px solid var(--stroke) !important;
            border-radius: 0px !important;
            font-weight: 600;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--neo-blue) !important;
        }

        .btn-neo {
            background: var(--neo-yellow);
            color: var(--stroke);
            font-weight: 800;
            border: 3px solid var(--stroke) !important;
            border-radius: 0px !important;
            box-shadow: 4px 4px 0px var(--stroke);
            transition: all 0.1s ease;
        }

        .btn-neo:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--stroke);
            background: #eab308;
        }

        .btn-neo:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--stroke);
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 m-3">
        <div class="text-center mb-4">
            <div class="d-inline-block p-3 bg-white border border-3 border-dark mb-3">
                <i class="fas fa-coffee fa-3x text-warning"></i>
            </div>
            <h3 class="fw-bold text-uppercase m-0" style="font-weight: 800;">COFFEE ID</h3>
            <p class="text-muted small fw-bold mt-1">OTORISASI AKSES SISTEM</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border border-2 border-dark rounded-0 fw-bold small text-center mb-3">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Password Owner / Admin</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border border-3 border-dark rounded-0 border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control py-2 text-center" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-neo btn-lg w-100 py-2 text-uppercase">Masuk Ke Sistem</button>
        </form>
    </div>

</body>
</html>
